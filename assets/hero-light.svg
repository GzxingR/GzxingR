<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="GZXINGR — vibe coder">
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D6487A" opacity="0.12"/>
    </pattern>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFBF8"/>
      <stop offset="0.55" stop-color="#F6F3EE"/>
      <stop offset="1" stop-color="#EFEAE3"/>
    </linearGradient>
    <style>
      .cur{animation:bl 1.1s steps(1,end) infinite}
      @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
      .sp{animation:tw 2.8s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.28}50%{opacity:.95}}
    </style>
  </defs>

  <rect width="960" height="430" rx="18" fill="url(#bgG)"/>
  <rect width="960" height="430" rx="18" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="428" rx="18" fill="none" stroke="#DCD6CB"/>

  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="48" y="48" fill="#8A8578" font-size="11" letter-spacing="3" font-family="ui-monospace, Menlo, Consolas, monospace">GZXINGR — VIBE CODER / SINCE 2020</text>
    <text x="912" y="48" fill="#A8A29A" font-size="10" letter-spacing="2" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">SESSION 037</text>
    <line x1="48" y1="62" x2="912" y2="62" stroke="#E4E0D8"/>

    <!-- 1 · 我 -->
    <path d="M896 96l15 10-15 10z" fill="#EDE7F4"/>
    <rect x="556" y="80" width="340" height="52" rx="16" fill="#EDE7F4"/>
    <text x="584" y="113" fill="#1B1F26" font-size="15.5">想把主页重做一下，别弄成简历。</text>

    <!-- 2 · AI -->
    <rect x="48" y="152" width="30" height="30" rx="9" fill="#D6487A" opacity="0.18"/>
    <text x="63" y="172" fill="#D6487A" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">AI</text>
    <path d="M96 168l-15 10 15 10z" fill="#FFFFFF"/>
    <rect x="96" y="152" width="236" height="52" rx="16" fill="#FFFFFF" stroke="#D6487A" stroke-opacity="0.5"/>
    <text x="122" y="185" fill="#1B1F26" font-size="15.5">那你现在算什么身份？</text>

    <!-- 3 · 我（核心） -->
    <path d="M896 253l15 10-15 10z" fill="#EDE7F4"/>
    <rect x="392" y="224" width="504" height="78" rx="16" fill="#EDE7F4"/>
    <text x="420" y="256" fill="#12151A" font-size="16.5" font-weight="600">算 vibe coder 吧。</text>
    <text x="420" y="284" fill="#3A4350" font-size="15">想法我出，代码它写，出事我背。</text>

    <!-- 4 · AI -->
    <rect x="48" y="320" width="30" height="30" rx="9" fill="#D6487A" opacity="0.18"/>
    <text x="63" y="340" fill="#D6487A" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">AI</text>
    <path d="M96 336l-15 10 15 10z" fill="#FFFFFF"/>
    <rect x="96" y="320" width="284" height="52" rx="16" fill="#FFFFFF" stroke="#D6487A" stroke-opacity="0.5"/>
    <text x="122" y="353" fill="#1B1F26" font-size="15.5">明白了。技能表就不放了。</text>

    <line x1="48" y1="392" x2="912" y2="392" stroke="#E4E0D8"/>
    <text x="48" y="414" fill="#9A948A" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">NOW</text>
    <text x="92" y="414" fill="#5A6472" font-size="11.5">在造 pi-desktop-genui · 在拆 ARTEX · 在删一半写废的东西</text>
    <rect class="cur" x="876" y="402" width="7" height="14" fill="#0E7C6B"/>

    <g fill="#D6487A" opacity="0.55" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="11" letter-spacing="1.5">
      <text x="300" y="112" transform="rotate(-7 300 112)">ピコン</text>
      <text x="330" y="300" transform="rotate(5 330 300)">ドン</text>
    </g>
    <path class="sp" d="M300 226l2.6 7 7 2.6-7 2.6-2.6 7-2.6-7-7-2.6 7-2.6z" fill="#D6487A"/>
  </g>
</svg>
